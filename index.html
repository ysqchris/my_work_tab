const $=id=>document.getElementById(id);let data={tasks:[],notes:[],knowledge:[],articles:[],updates:[],products:[],bookmarks:[],media:[],news:[]},radarProductId='all',radarScope='all',articleCat='all',articleMonth='current',articleFavOnly=false,knowledgeKind='all',bmAddKind='memo',mediaSubtype='movie',mediaStatus='wish',mediaHotItems=[],mediaHotError=null,mediaHotUpdated=null;
const api=async(url,method='GET',body)=>{let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function formatSize(n){if(n==null)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
async function load(){let [t,n,k,a,u,p,b,m,g,ql,news]=await Promise.all(['tasks','notes','knowledge','articles','products_updates','products','bookmarks','media'].map(x=>api('/api/'+x)).concat([api('/api/bookmark-groups'),api('/api/qlearning-lives'),api('/api/news')]));data={tasks:t.items||[],notes:n.items||[],knowledge:k.items||[],articles:a.items||[],updates:u.items||[],products:p.products||[],bookmarks:b.items||[],media:m.items||[],bmGroups:g.items||[],qlLives:ql.items||[],qlLivesUpdated:ql.updated_at||'',news:news.items||[],newsUpdatedAt:news.updated_at||''};render()}
function showView(id,node){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));if(node)node.classList.add('active');if(id==='media')loadMediaHot();requestAnimationFrame(fitNewsPanel)}
function homeCardNav(e,view){let el=e.target;while(el&&el!==e.currentTarget){if(el.matches('a,button,input,textarea,select,[contenteditable],[onclick]'))return;el=el.parentElement}showView(view,document.querySelector(`[data-view=${view}]`))}
function render(){renderTodoPanel();renderKnowledge();renderBookmarks();renderNews();renderMedia();renderNotes();renderRadar();renderArticles();renderHomePreviews()}
function empty(t){return `<div class="empty">${t}</div>`}
function shortDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return '';let [y,m,day]=d.split('-');return `${Number(m)} 月 ${Number(day)} 日`}
const WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
function updateClock(){let n=new Date(),h=n.getHours();let greet=h<6?'夜深了':h<12?'早上好':h<14?'中午好':h<18?'下午好':h<22?'晚上好':'夜深了';let hero=$('heroGreeting');if(hero)hero.textContent=`${greet}，先想清楚，再做今天最重要的事。`;let td=$('topDate');if(td)td.textContent=`${WEEKDAYS[n.getDay()]}，${n.getMonth()+1} 月 ${n.getDate()} 日`;let bc=$('bmClock');if(bc)bc.textContent=`${n.getMonth()+1}月${n.getDate()}日 ${WEEKDAYS[n.getDay()]} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`}
let _weatherLoaded=false;
async function loadBmWeather(){let el=$('bmWeather');if(!el||_weatherLoaded)return;_weatherLoaded=true;try{let r=await fetch('/api/weather?city=深圳');let j=await r.json();if(j.temp_c!=null){let icon=j.icon?(j.icon.startsWith('http')?j.icon:'https:'+j.icon):'';el.innerHTML=`${icon?`<img src="${icon}" alt="">`:''}<b>${Math.round(j.temp_c)}°</b>`}else el.innerHTML=''}catch(e){el.innerHTML=''}}
function renderHomePreviews(){$('recentKnowledge').innerHTML=data.knowledge.slice(0,3).map(knowledgeMiniHtml).join('')||empty('还没有沉淀内容');$('recentNotes').innerHTML=data.notes.slice(0,2).map(noteHtml).join('')||empty('写下今天第一条笔记。');$('radarBrief').innerHTML=data.updates.slice(0,3).map(u=>`<div class="signal"><b>${esc(u.title)}</b><p>${esc(u.product||'鹰眼')} · ${esc(u.date||'最新信号')}</p><span class="link" onclick="toggleFav('products_updates','${u.id}')">${u.favorited?'取消收藏':'收藏'}</span></div>`).join('')||'<div class="signal"><b>鹰眼正在等待新的产品动态</b><p>现有关注对象的更新会显示在这里。</p></div>';$('homeArticles').innerHTML=[...data.articles].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).map(a=>`<div class="article"><div class="article-score">${a.hot?'🔥':'◫'}</div><div class="row-main"><div class="row-title">${a.url?`<a href="${esc(a.url)}" target="_blank">${esc(a.title)}</a>`:esc(a.title)}</div><div class="row-meta">${esc(a.author||'KM 推荐')}</div></div></div>`).join('')||empty('还没有同步到 KM热榜。');renderHomeLives()}
function liveStatus(c,now){if(!c.startTime)return 'upcoming';let start=new Date(c.startTime.replace(' ','T'));let end=c.endTime?new Date(c.endTime.replace(' ','T')):null;if(now<start)return 'upcoming';if(end){if(now>end)return 'ended';return 'live'}return now>=start?'live':'upcoming'}
function liveBadgeHtml(status){if(status==='live')return '<span class="live-badge live"><span class="dot"></span>直播中</span>';if(status==='ended')return '<span class="live-badge ended">已结束</span>';return '<span class="live-badge upcoming">未开始</span>'}
function renderHomeLives(){let now=new Date();let list=[...(data.qlLives||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));let upcoming=list.filter(x=>!x.startTime||new Date(x.startTime.replace(' ','T'))>=new Date(now.getFullYear(),now.getMonth(),now.getDate()));let show=(upcoming.length?upcoming:list).slice(0,5);let order={live:0,upcoming:1,ended:2};show=[...show].sort((a,b)=>{let sa=liveStatus(a,now),sb=liveStatus(b,now);if(order[sa]!==order[sb])return order[sa]-order[sb];return (a.startTime||'').localeCompare(b.startTime||'')});$('homeLivesUpdated').textContent=data.qlLivesUpdated?('更新于 '+data.qlLivesUpdated.slice(5,16)):'';$('homeLives').innerHTML=show.length?show.map(c=>{let st=c.startTime||'';let day=st?st.slice(5,10):'';let hm=st?st.slice(11,16):'';let status=liveStatus(c,now);return `<div class="article ${status==='ended'?'live-ended':''}"><div class="article-score" style="font-size:12px;width:44px">${esc(day)}<br>${esc(hm)}</div><div class="row-main"><div class="row-title">${c.href?`<a href="${esc(c.href)}" target="_blank">${esc(c.title)}</a>`:esc(c.title)}${liveBadgeHtml(status)}</div><div class="row-meta">${esc(c.author||'腾讯学堂')}</div></div></div>`}).join(''):empty('暂无即将开始的学堂直播。')}
function todoRowHtml(x){let thumbMatch=x.content&&x.content.match(/<img[^>]*src="([^"]+)"/);let thumb=x.image?`/api/knowledge/files/${encodeURIComponent(x.image)}`:(thumbMatch?thumbMatch[1]:'');let textPreview=x.content?x.content.replace(/<img[^>]*>/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim():'';let meta=[x.priority?`<span class="tag">${esc(x.priority)}</span>`:'',x.date?shortDate(x.date):''].filter(Boolean).join(' · ');return `<div class="task ${x.done?'done':''}"><span class="tick ${x.done?'done':''}" onclick="toggleTask('${x.id}')">${x.done?'✓':''}</span>${thumb?`<img class="task-thumb" src="${thumb}" alt="">`:''}<div class="task-name">${esc(x.title)}${textPreview?`<div class="task-note">${esc(textPreview.slice(0,60))}</div>`:''}${meta?`<div class="task-note">${meta}</div>`:''}</div><span class="task-del" onclick="removeTask('${x.id}')" title="删除">✕</span></div>`}
function renderTodoPanel(){let items=[...data.tasks].sort((a,b)=>(a.done===b.done?0:a.done?1:-1));$('todoList').innerHTML=items.length?items.map(todoRowHtml).join(''):empty('还没有待办，写下第一条吧。')}
async function toggleTask(id){let x=data.tasks.find(x=>x.id===id);await api('/api/tasks/'+id,'PUT',{done:!x.done});await load()}
async function removeTask(id){await api('/api/tasks/'+id,'DELETE');await load()}
function expandTodoCompose(){$('todoCompose').classList.add('open')}
function collapseTodoCompose(force=false){let title=$('todoQuick').value.trim(),box=$('todoContent'),plain=(box.innerText||'').trim(),hasImg=!!box.querySelector('img');if(!force&&(title||plain||hasImg))return;$('todoCompose').classList.remove('open');$('todoQuick').value='';box.innerHTML='';$('todoPriority').value='中';$('todoDate').value='';$('todoQuick').blur()}
function todoQuickKey(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submitTodoCompose()}if(e.key==='Escape'){e.preventDefault();collapseTodoCompose(true)}}
async function handleTodoPaste(e){let cd=e.clipboardData||window.clipboardData;if(!cd)return;let items=[...(cd.items||[])];let imgItem=items.find(it=>it.type&&it.type.indexOf('image')===0);let file=imgItem?imgItem.getAsFile():null;if(!file)return;e.preventDefault();expandTodoCompose();try{let up=await uploadPasteImage(file);document.execCommand('insertHTML',false,`<img src="/api/knowledge/files/${encodeURIComponent(up.stored_name)}">`)}catch(err){console.error(err)}}
async function submitTodoCompose(){let title=$('todoQuick').value.trim(),box=$('todoContent'),content=box.innerHTML.trim(),plain=(box.innerText||'').trim(),hasImg=!!box.querySelector('img');if(!title&&!plain&&!hasImg)return;let body={title:title||plain.slice(0,40)||'未命名待办',priority:$('todoPriority').value,today:true};if(content&&(plain||hasImg))body.content=content;let d=$('todoDate').value;if(d)body.date=d;await api('/api/tasks','POST',body);collapseTodoCompose(true);await load()}
function knowledgeIcon(k){return k==='file'?'📄':k==='document'?'✎':'↗'}

function isKnowledgeImage(x){if((x.kind||'')!=='file'||!x.stored_name)return false;if((x.mime||'').startsWith('image/'))return true;return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(x.filename||x.stored_name||'')}

function knowledgeMiniHtml(x){let kind=x.kind||'link',title=esc(x.title||x.filename||'未命名'),icon=isKnowledgeImage(x)?`<img src="${esc(knowledgeFileUrl(x))}" alt="">`:knowledgeIcon(kind);return `<div class="article"><div class="inbox-icon">${icon}</div><div class="row-main"><div class="row-title"><span class="link" onclick="openKnowledgeItem('${x.id}')">${title}</span></div><div class="row-meta">${esc(knowledgeKindLabel(kind))}${x.topic?' · '+esc(x.topic):''}</div></div></div>`}
function knowledgeCardHtml(x){let kind=x.kind||'link',title=esc(x.title||x.filename||'未命名'),foot=[x.topic,x.date||(x.created_at||'').slice(0,10)].filter(Boolean).map(esc).join(' · '),img=isKnowledgeImage(x);return `<article class="kb-card ${img?'has-thumb':''}" onclick="openKnowledgeItem('${x.id}')">${img?`<div class="kb-thumb"><img src="${esc(knowledgeFileUrl(x))}" alt="${title}" loading="lazy"></div>`:''}<div class="kb-card-top"><div class="kb-card-icon">${img?'🖼':knowledgeIcon(kind)}</div><span class="kb-card-kind">${esc(img?'图片':knowledgeKindLabel(kind))}</span></div><div class="kb-card-title">${title}</div><div class="kb-card-excerpt">${esc(knowledgeExcerpt(x))}</div><div class="kb-card-foot"><span class="meta">${foot||'—'}</span><button class="btn" onclick="event.stopPropagation();removeKnowledge('${x.id}')">删除</button></div></article>`}
function filterKnowledge(kind){knowledgeKind=kind;renderKnowledge()}

function renderRadarNav(){let groups={};data.products.forEach(p=>{let t=p.type||'未分类';(groups[t]=groups[t]||[]).push(p)});let favCount=data.updates.filter(u=>u.favorited).length,unreadAll=unreadUpdates(data.updates).length;let html=`<div class="radar-nav-head"><span>竞品</span><span>${data.products.length}</span></div><div class="radar-nav-item ${radarProductId==='all'?'active':''}" onclick="selectRadarProduct('all')"><span>全部动态</span>${unreadBadge(unreadAll)}</div>`;productTypes().forEach(t=>{html+=`<div class="radar-nav-group">${esc(t)}</div>`;(groups[t]||[]).sort((a,b)=>{if(!!a.paused!==!!b.paused)return a.paused?1:-1;return (a.name||'').localeCompare(b.name||'')}).forEach(p=>{let n=unreadUpdates(updatesFor(p.name)).length;html+=`<div class="radar-nav-item ${radarProductId===p.id?'active':''} ${p.paused?'is-paused':''}" onclick="selectRadarProduct('${p.id}')"><span>${esc(p.name)}${p.paused?' <span class="pause-tag">暂停</span>':''}</span>${unreadBadge(n)}</div>`})});$('radarNav').innerHTML=html;$('radarFavFilters').innerHTML=`<button class="filter ${radarScope==='all'?'active':''}" onclick="setRadarScope('all')">全部</button><button class="filter ${radarScope==='unread'?'active':''}" onclick="setRadarScope('unread')">只看未读 <span style="opacity:.65">${unreadAll}</span></button><button class="filter ${radarScope==='fav'?'active':''}" onclick="setRadarScope('fav')">只看收藏 <span style="opacity:.65">${favCount}</span></button>`}

function renderRadar(){if(radarProductId!=='all'&&!data.products.some(p=>p.id===radarProductId))radarProductId='all';renderRadarNav();renderRadarProfile();let list;if(radarProductId==='all')list=[...data.updates].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(a.product||'').localeCompare(b.product||''));else{let p=data.products.find(x=>x.id===radarProductId);list=p?updatesFor(p.name):[]}

function normCat(c){return String(c||'未分类').replace(/\s+/g,'').trim()||'未分类'}
function articleCats(){let seen=[],map={};data.articles.forEach(a=>{let n=normCat(a.category),raw=a.category||'未分类';if(!map[n]){map[n]=raw;seen.push(n)}});return seen.map(n=>({key:n,label:map[n]}))}
function articleMonthOf(d){return d&&d.length>=7?d.slice(0,7):''}
function currentMonthKey(){let n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`}
function resolvedArticleMonth(){return articleMonth==='current'?currentMonthKey():articleMonth}
function articleMonths(){return [...new Set(data.articles.map(a=>articleMonthOf(a.date)).filter(Boolean))].sort((a,b)=>b.localeCompare(a))}
function monthLabel(m){let [y,mo]=m.split('-');return `${y} 年 ${Number(mo)} 月`}
function dateLabel(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return d||'未知日期';let [y,m,day]=d.split('-');return `${y} 年 ${Number(m)} 月 ${Number(day)} 日`}
function filteredArticles(){let month=resolvedArticleMonth();return data.articles.filter(a=>(!articleFavOnly||a.favorited)&&(articleCat==='all'||normCat(a.category)===articleCat)&&(month==='all'||articleMonthOf(a.date)===month)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||normCat(a.category).localeCompare(normCat(b.category))||(b.reads||0)-(a.reads||0))}

function articleHtml(a){let clickAttr=a.url?` onclick="window.open('${esc(a.url)}','_blank')"`:'';let favs=a.favs!=null?esc(a.favs):'0',likes=a.likes!=null?esc(a.likes):'0',reads=a.reads!=null?esc(a.reads):'0';return `<article class="article km km-card"${clickAttr}><div class="km-card-title">${esc(a.title)}</div><div class="km-card-row2"><span class="km-card-author">${esc(a.author||'')}</span>${a.date?`<span class="km-card-date">${esc(a.date)}</span>`:''}</div><div class="km-card-divider"></div><div class="km-card-stats-row"><div class="km-card-stats"><span>★ ${favs}</span><span>👍 ${likes}</span><span>👁 ${reads}</span></div><button class="btn fav ${a.favorited?'on':''}" onclick="event.stopPropagation();toggleFav('articles','${a.id}')">${a.favorited?'★ 已收藏':'☆ 收藏'}</button></div></article>`}

function renderArticles(){let cats=articleCats(),months=articleMonths(),cur=currentMonthKey(),others=months.filter(m=>m!==cur),list=filteredArticles(),favCount=data.articles.filter(a=>a.favorited).length,picked=articleMonth!=='all'&&articleMonth!=='current'?articleMonth:'';
$('articleScopeFilters').innerHTML=`<div class="km-filter-group"><span class="km-filter-label">范围</span><div class="km-segment"><button class="${!articleFavOnly?'active':''}" onclick="setArticleFavOnly(false)">全部</button><button class="${articleFavOnly?'active':''}" onclick="setArticleFavOnly(true)">收藏 <em>${favCount}</em></button></div></div>`;

$('articleMonthFilters').innerHTML=`<div class="km-filter-group"><span class="km-filter-label">时间</span><div class="km-segment"><button class="${articleMonth==='all'?'active':''}" onclick="filterArticlesMonth('all')">全部</button><button class="${articleMonth==='current'?'active':''}" onclick="filterArticlesMonth('current')">当月</button><select class="km-filter-select km-month-select" onchange="filterArticlesMonth(this.value||'current')"><option value="">其他月份</option>${others.map(m=>`<option value="${esc(m)}" ${picked===m?'selected':''}>${esc(monthLabel(m))}（${data.articles.filter(a=>articleMonthOf(a.date)===m).length}）</option>`).join('')}</select></div></div>`;

let writeDraftId=null,writeTimer=null,writeBusy=false;
function focusQuickNote(){if(!$('home').classList.contains('active'))showView('home',document.querySelector('[data-view=home]'));setTimeout(expandWrite,0)}
function expandWrite(){if(document.body.classList.contains('write-mode'))return;document.body.classList.add('write-mode');let stage=$('writeStage');stage.setAttribute('aria-hidden','false');requestAnimationFrame(()=>stage.classList.add('show'));$('writeStatus').textContent='写点什么，也可以粘贴图片';setTimeout(()=>$('writePad').focus(),40)}

async function uploadPasteImage(file){let name=file.name&&file.name!=='blob'?file.name:('paste.'+(file.type.split('/')[1]||'png'));let fd=new FormData();fd.append('file',file,name);let r=await fetch('/api/upload',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());return r.json()}
function insertWriteImage(url){let pad=$('writePad');pad.focus();let html=`<div><img src="${url}"></div><div><br></div>`;if(document.queryCommandSupported&&document.queryCommandSupported('insertHTML'))document.execCommand('insertHTML',false,html);else{let sel=window.getSelection();if(!sel||!sel.rangeCount){pad.innerHTML+=html;return}let range=sel.getRangeAt(0);range.deleteContents();let node=document.createElement('div');node.innerHTML=html;let frag=document.createDocumentFragment();while(node.firstChild)frag.appendChild(node.firstChild);range.insertNode(frag);sel.collapseToEnd()}}
async function handleWritePaste(e){let cd=e.clipboardData||window.clipboardData;if(!cd)return;let items=[...(cd.items||[])];let imgItem=items.find(it=>it.type&&it.type.indexOf('image')===0);let file=imgItem?imgItem.getAsFile():null;if(!file&&cd.files&&cd.files.length)file=[...cd.files].find(f=>(f.type||'').indexOf('image')===0);if(!file)return;e.preventDefault();$('writeStatus').textContent='上传图片中…';try{let up=await uploadPasteImage(file);insertWriteImage(`/api/knowledge/files/${encodeURIComponent(up.stored_name)}`);$('writeStatus').textContent='图片已插入';scheduleWriteSave()}catch(err){$('writeStatus').textContent='图片上传失败，请重试';console.error(err)}}
async function flushWrite(){let pad=$('writePad'),html=pad.innerHTML,text=(pad.innerText||'').trim(),hasImg=!!pad.querySelector('img');if((!text&&!hasImg)||writeBusy)return;writeBusy=true;$('writeStatus').textContent='保存中…';try{let title=(text.split('\n').find(l=>l.trim())||(hasImg?'图片笔记':'未命名笔记')).slice(0,40);if(writeDraftId)await api('/api/notes/'+writeDraftId,'PUT',{title,content:html});else{let created=await api('/api/notes','POST',{title,content:html});writeDraftId=created.id}$('writeStatus').textContent='已自动保存'}catch(e){$('writeStatus').textContent='保存失败，稍后重试'}finally{writeBusy=false}}
async function collapseWrite(){if(!document.body.classList.contains('write-mode'))return;clearTimeout(writeTimer);await flushWrite();document.body.classList.remove('write-mode');$('writeStage').classList.remove('show');$('writeStage').setAttribute('aria-hidden','true');writeDraftId=null;$('writePad').innerHTML='';await load()}
function modal(html,wide=false){$('modalBody').innerHTML=html;$('modalBody').classList.toggle('wide',!!wide);$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');$('modalBody').classList.remove('wide')}
function openNote(){modal(`<h3>写下想法</h3><div class="field"><label>标题</label><input id="mTitle" placeholder="一句话概括"></div><div class="field"><label>内容</label><textarea id="mContent" rows="5" placeholder="把脑海中的判断记下来…"></textarea></div><div class="field"><label>主题</label><input id="mTopic" placeholder="例如：个人工作台"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="createNote()">保存</button></div>`)}async function createNote(){let title=$('mTitle').value.trim(),content=$('mContent').value.trim();if(!title&&!content)return;await api('/api/notes','POST',{title:title||'未命名想法',content,topic:$('mTopic').value.trim()});closeModal();load()}document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusQuickNote()}if(e.key==='Escape'&&document.body.classList.contains('write-mode')){e.preventDefault();collapseWrite()}else if(e.key==='Escape'&&$('todoCompose').classList.contains('open')){e.preventDefault();collapseTodoCompose(true)}});document.addEventListener('mousedown',e=>{let c=$('todoCompose');if(!c.classList.contains('open')||c.contains(e.target))return;collapseTodoCompose(false)});document.addEventListener('mousedown',e=>{let wrap=$('bmQuick');if(!wrap||!wrap.classList.contains('show'))return;let toggleBtn=$('bmAddToggleBtn');if(wrap.contains(e.target)||(toggleBtn&&toggleBtn.contains(e.target)))return;closeBmQuick()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('bmQuick')&&$('bmQuick').classList.contains('show')){e.preventDefault();closeBmQuick()}});$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};function fitNewsPanel(){let p=$('bmNewsPanel');if(!p)return;let sec=$('bookmarks');if(!sec||!sec.classList.contains('active')){p.style.height='';p.style.maxHeight='';return}if(window.innerWidth<=900){p.style.height='';p.style.maxHeight='60vh';return}let prev=p.style.height;p.style.height='0px';let top=p.getBoundingClientRect().top;p.style.height=prev;let h=Math.max(240,Math.floor(window.innerHeight-top-20));p.style.height=h+'px';p.style.maxHeight=h+'px'}
window.addEventListener('resize',fitNewsPanel);window.addEventListener('scroll',fitNewsPanel,{passive:true});
updateClock();setInterval(()=>{updateClock();renderHomeLives()},60000);loadBmWeather();load();
</script></body></html>
